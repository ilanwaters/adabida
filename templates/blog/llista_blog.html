<!-- templates/llista_blog.html -->
<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Gestió de blog</title>
</head>
<body>
    <h1>Entrades del blog</h1>
    <ul>
        {% for entrada in entrades %}
            <li>
                <strong>{{ entrada.titol }}</strong> - {{ entrada.data_creacio.strftime('%d/%m/%Y') }} - {{ entrada.firma }}
                <a href="{{ url_for('blog.editar_entrada_blog', entrada_id=entrada.id) }}">✏️ Edita</a>
                <form method="POST" action="{{ url_for('blog.eliminar_entrada_blog', entrada_id=entrada.id) }}" style="display:inline;">
                    <button type="submit">🗑️ Elimina</button>
                </form>
            </li>
        {% endfor %}
    </ul>
     <div class="enllac-retorn">
      <p><a href="{{ url_for('admin.pagina_admin') }}"> Tornar a l’administració</a></p>

    </div>
</body>
</html>
