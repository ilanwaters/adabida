<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Benvingut a Adabida</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      flex-direction: column;
    }
    .splash-logo {
      width: 180px;   /* pots ajustar la mida */
      height: auto;
      margin-bottom: 1rem;
    }
    h1 { margin: 0.5rem 0; }
    p { margin: 1rem 0 2rem 0; max-width: 600px; }
    button {
      margin: 0 0.5rem;
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    #entra-btn { background: #3d3d3c; color: white; }
    #no-mostrar-btn { background: #ccc; }
  </style>
</head>
<body>
<img src="{{ url_for('static', filename='img/logo.png') }}" 
     alt="Logo Adabida" 
     class="splash-logo">


  <h1>Benvingut a Adabida</h1>
  <p>
    Adabida és un arxiu històric en el qual els records personals es
    converteixen en fonts primàries de l'estudi de les ciències socials.
  </p>
  <div>
    <button id="entra-btn">Entrar</button>
    <button id="no-mostrar-btn">No tornar a mostrar</button>
  </div>

  <script>
    const entraBtn = document.getElementById("entra-btn");
    const noMostrarBtn = document.getElementById("no-mostrar-btn");

    // Si ja hi ha preferència guardada, redirigeix directament
    if (localStorage.getItem("skipSplash") === "true") {
      window.location.href = "/inici";
    }

    entraBtn.addEventListener("click", () => {
      window.location.href = "/inici";
    });

    noMostrarBtn.addEventListener("click", () => {
      localStorage.setItem("skipSplash", "true");
      window.location.href = "/inici";
    });
  </script>
</body>
</html>
