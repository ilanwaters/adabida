{% extends "base.html" %}

{% block titol %}{{ _('Fes una aportació') }}{% endblock %}

{% block css %}

 <link rel="stylesheet" href="{{ url_for('static', filename='css/nova_aportacio.css') }}">
 <link rel="stylesheet" href="{{ url_for('static', filename='css/pagina_personal.css') }}">
{% endblock %}

{% block contingut %}
<div class="aportacio-form">
  <h1>{{ _('Fes una aportació a Adabida') }}</h1>
  
  <form method="POST" id="formAportacio">
    
    <!-- Periodicitat -->
    <div class="periodicitat">
      <input type="radio" name="periodicitat" id="unica" value="unica" checked>
      <label for="unica">{{ _('Aportació única') }}</label>
      
      <input type="radio" name="periodicitat" id="mensual" value="mensual">
      <label for="mensual">{{ _('Mensual') }}</label>
      
      <input type="radio" name="periodicitat" id="anual" value="anual">
      <label for="anual">{{ _('Anual') }}</label>
    </div>

    <!-- Quantitats predefinides -->
    <div class="quantitats">
      <input type="radio" name="quantitat_btn" id="q2" value="2">
      <label for="q2">2€</label>
      
      <input type="radio" name="quantitat_btn" id="q5" value="5" checked>
      <label for="q5">5€</label>
      
      <input type="radio" name="quantitat_btn" id="q10" value="10">
      <label for="q10">10€</label>
      
      <input type="radio" name="quantitat_btn" id="q20" value="20">
      <label for="q20">20€</label>
      
      <input type="radio" name="quantitat_btn" id="q50" value="50">
      <label for="q50">50€</label>
      
      <input type="radio" name="quantitat_btn" id="q100" value="100">
      <label for="q100">100€</label>
    </div>

    <!-- Altra quantitat -->
    <div class="altra-quantitat">
      <label for="altra">{{ _('O indica una altra quantitat:') }}</label>
      <input type="number" step="0.01" id="altra" name="altra_quantitat" placeholder="{{ _('Quantitat en euros') }}">
    </div>

    <input type="hidden" name="quantitat" id="quantitat_final" value="5">

    <!-- Mètode de pagament -->
    <div class="metodes">
      <label for="metode">{{ _('Mètode de pagament:') }}</label>
      <select name="metode_pagament" id="metode" required>
        <option value="">{{ _('-- Selecciona un mètode --') }}</option>
        <option value="Transferència">{{ _('Transferència bancària') }}</option>
        <option value="Bizum">Bizum</option>
        <option value="PayPal">PayPal</option>
        <option value="Targeta">{{ _('Targeta de crèdit/dèbit') }}</option>
      </select>
    </div>

    <!-- Camp ocult per l'admin -->
    <input type="hidden" name="usuari_id" value="">
    <input type="hidden" name="data" value="{{ today }}">
    <input type="hidden" name="estat" value="pendent">
    <input type="hidden" name="pais" value="Espanya">

    <button type="submit" class="boto_nav">{{ _('Continuar') }}</button>
    
    <p class="nota-seguretat">🔒 {{ _('Pagament segur i encriptat') }}</p>
  </form>
</div>

<script>
// Actualitzar quantitat final
document.querySelectorAll('input[name="quantitat_btn"]').forEach(radio => {
  radio.addEventListener('change', function() {
    document.getElementById('quantitat_final').value = this.value;
    document.getElementById('altra').value = '';
  });
});

document.getElementById('altra').addEventListener('input', function() {
  if (this.value) {
    document.querySelectorAll('input[name="quantitat_btn"]').forEach(r => r.checked = false);
    document.getElementById('quantitat_final').value = this.value;
  }
});

// Validació abans d'enviar
document.getElementById('formAportacio').addEventListener('submit', function(e) {
  const quantitat = parseFloat(document.getElementById('quantitat_final').value);
  if (!quantitat || quantitat <= 0) {
    e.preventDefault();
    alert('{{ _("Si us plau, selecciona o indica una quantitat") }}');
  }
});
</script>
{% endblock %}
