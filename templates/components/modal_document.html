<!-- templates/components/modal_document.html -->
<div id="modal-document" class="modal" style="display: none;">
 <div class="modal-content" style="display: flex; flex-direction: column; width: 90vw; max-width: 90vw; max-height: 90vh; overflow-y: auto; padding: 0;">

    <!-- ESTAT 1: Resum del grup -->
              <div id="modal-document-resum" style="padding: 1.5rem;">
      <div style="display: flex; gap: 1.5rem; align-items: flex-start;">
        <img src="{{ url_for('static', filename='icons/document.png') }}" alt="Document" style="width: 100px; height: 100px; object-fit: cover; flex-shrink: 0;">
        <div style="flex: 1;">
          <h2 id="modal-document-grup-titol" style="margin: 0 0 0.5rem 0;">—</h2>
          <p id="modal-document-grup-descripcio" style="margin: 0 0 1rem 0; color: #666;"></p>
          <div class="modal-arxius-graella" id="modal-document-icones" style="display: flex; gap: 10px;"></div>
        </div>
      </div>
    </div>

    <!-- ESTAT 2: Document actiu obert (ocult per defecte) -->
        <div id="modal-document-actiu" style="display: none; flex-direction: column; flex: 1; padding: 1.5rem;">
        <div id="modal-document-actiu-visor" style="flex: 1; min-height: 400px;"></div>

        <div style="padding-top: 1rem;">
            <h4 id="modal-document-actiu-titol" style="margin: 0 0 0.2rem 0;"></h4>
            <p id="modal-document-actiu-any" style="margin: 0 0 0.2rem 0; color: #666;"></p>
            <p id="modal-document-actiu-descripcio" style="margin: 0 0 1rem 0;"></p>

            <button type="button" class="boto_nav" onclick="pantallaCompletaDocument()">
                {{ _('Pantalla completa') }}
            </button>
            
        </div>
    </div>
    <div class="modal-botons modal-botons-accions">
      <div class="modal-meta-autoria">
        <span id="modal-document-autor"></span><br>
        <span id="modal-document-visibilitat"></span>
      </div>
      <div class="modal-grup-botons">
        {% if es_admin %}
        <button id="boto-editar-document" type="button" class="boto_nav" data-id="" onclick="obreEdicioDocument()">{{ _('Editar') }}</button>
        <button id="boto-eliminar-document" type="button" class="boto_nav" data-id="" onclick="confirmaEliminacioGrup()">{{ _('Eliminar') }}</button>
        {% endif %}
        <button class="boto_nav" onclick="tancaModalDocument()">{{ _('Tancar') }}</button>
      </div>
    </div>

  </div>
</div>
