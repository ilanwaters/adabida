<!-- MODAL PER SELECCIONAR CONTACTE -->
<div id="modal-contactes" class="modal" style="display: none;">
  <div class="modal-content">
    <div class="modal-text" style="grid-column: 1 / -1;">
      <h2>{{ _('Selecciona contacte') }}</h2>

      <div id="llista-contactes" class="llista-contactes">
        <!-- Es carrega amb AJAX -->
        <div style="text-align: center; color: #666; margin: 2rem 0;">
          {{ _('Carregant contactes...') }}
        </div>
      </div>

      <p style="color: #666; font-size: 0.9rem; margin-top: 1rem;">{{ _('No trobes el contacte?') }}</p>
    </div>

    <div class="modal-botons-accions">
      <button type="button" onclick="tancarModalContactes()" class="boto_nav">{{ _('Cancel·lar') }}</button>
      <button type="button" onclick="obreModalNouMissatgeDirecte()" class="boto_nav">{{ _('Escriure a altre usuari') }}</button>
    </div>
  </div>
</div>
