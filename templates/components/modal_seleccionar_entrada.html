<!-- COMPONENT: Modal seleccionar entrada -->
<div id="modal-seleccionar-entrada" class="modal-overlay" style="display: none;">
  <div class="modal-container">
    <div class="modal-header">
      <h3>
        <i class="fas fa-link"></i>
        {{ _('Enllaçar una entrada') }}
      </h3>
      <button class="boto-tancar" onclick="tancarModalEntrades()" aria-label="{{ _('Tancar') }}">
        <i class="fas fa-times"></i>
      </button>
    </div>
    
    <div class="modal-body">
      <!-- Cercador -->
      <div class="cercador-entrades">
        <input type="text" 
               id="cerca-entrada" 
               class="input-cerca" 
               placeholder="{{ _('Cercar entrades...') }}"
               onkeyup="filtrarEntrades()">
        <i class="fas fa-search icona-cerca"></i>
      </div>
      
      <!-- Llista d'entrades -->
      <div id="llista-entrades" class="llista-entrades">
        <!-- Es carrega dinàmicament amb JavaScript -->
      </div>
    </div>
    
    <div class="modal-footer">
      <button type="button" class="boto_nav" onclick="tancarModalEntrades()">
        <i class="fas fa-times"></i>
        {{ _('Cancel·lar') }}
      </button>
      <button type="button" class="boto_nav" onclick="inserirEnllaçEntrada()">
        <i class="fas fa-check"></i>
        {{ _('Inserir enllaç') }}
      </button>
    </div>
  </div>
</div>

<style>
/* Modal Overlay */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.modal-container {
  background: white;
  border-radius: 12px;
  max-width: 600px;
  width: 100%;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  animation: modalFadeIn 0.3s ease;
}

@keyframes modalFadeIn {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Modal Header */
.modal-header {
  padding: 1.5rem;
  border-bottom: 1px solid #eee;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border-radius: 12px 12px 0 0;
}

.modal-header h3 {
  margin: 0;
  font-size: 1.3rem;
  font-weight: 600;
}

.modal-header i {
  margin-right: 0.5rem;
}

.boto-tancar {
  background: transparent;
  border: none;
  color: white;
  font-size: 1.5rem;
  cursor: pointer;
  padding: 0.5rem;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background 0.2s;
}

.boto-tancar:hover {
  background: rgba(255, 255, 255, 0.2);
}

/* Modal Body */
.modal-body {
  padding: 1.5rem;
  overflow-y: auto;
  flex: 1;
}

/* Cercador */
.cercador-entrades {
  position: relative;
  margin-bottom: 1.5rem;
}

.input-cerca {
  width: 100%;
  padding: 0.8rem 1rem 0.8rem 3rem;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 1rem;
  transition: border-color 0.3s;
}

.input-cerca:focus {
  outline: none;
  border-color: #14d8ce;
}

.icona-cerca {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: #999;
  pointer-events: none;
}

/* Llista entrades */
.llista-entrades {
  max-height: 400px;
  overflow-y: auto;
}

.entrada-item {
  display: flex;
  align-items: flex-start;
  padding: 1rem;
  border: 2px solid #f0f0f0;
  border-radius: 8px;
  margin-bottom: 0.8rem;
  cursor: pointer;
  transition: all 0.3s;
}

.entrada-item:hover {
  border-color: #14d8ce;
  background: #f8ffff;
}

.entrada-item input[type="radio"] {
  margin-right: 1rem;
  margin-top: 0.3rem;
  cursor: pointer;
  width: 18px;
  height: 18px;
  accent-color: #14d8ce;
}

.entrada-item label {
  flex: 1;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

.entrada-item strong {
  color: #333;
  font-size: 1rem;
}

.entrada-data {
  color: #999;
  font-size: 0.85rem;
}

.entrada-item:has(input:checked) {
  border-color: #14d8ce;
  background: #e6fffe;
}

.text-muted {
  color: #999;
  text-align: center;
  padding: 2rem;
  font-style: italic;
}

/* Modal Footer */
.modal-footer {
  padding: 1.5rem;
  border-top: 1px solid #eee;
  display: flex;
  gap: 1rem;
  justify-content: flex-end;
}

/* Responsive */
@media (max-width: 768px) {
  .modal-container {
    max-height: 90vh;
  }
  
  .modal-footer {
    flex-direction: column;
  }
  
  .modal-footer .boto {
    width: 100%;
    justify-content: center;
  }
}
</style>

<script>
// Funció per filtrar entrades al modal
function filtrarEntrades() {
  const cerca = document.getElementById('cerca-entrada').value.toLowerCase();
  const items = document.querySelectorAll('.entrada-item');
  
  items.forEach(item => {
    const text = item.textContent.toLowerCase();
    if (text.includes(cerca)) {
      item.style.display = 'flex';
    } else {
      item.style.display = 'none';
    }
  });
}
</script>
